<style>

    --plane:#f6f7f9; --surface:#ffffff; --surface-2:#f1f3f6; --surface-3:#e9edf2;
    --ink:#0e1116; --ink-2:#4a5361; --muted:#8a919c;
    --grid:#e4e7ec; --border:rgba(14,17,22,.10); --border-strong:rgba(14,17,22,.16);
    --accent:#2a78d6; --accent-ink:#1c5cab; --accent-weak:#eaf1fb;
    --good:#0ca30c; --warning:#e0920a; --serious:#d5673a; --critical:#d03b3b;
    --good-weak:#e6f5e6; --warning-weak:#fbf1dc; --serious-weak:#fceee7; --critical-weak:#fae8e8;
    --shadow:0 1px 2px rgba(14,17,22,.04), 0 4px 16px rgba(14,17,22,.05);
    --r:14px; --r-sm:9px;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --plane:#0b0d11; --surface:#14171d; --surface-2:#1a1e26; --surface-3:#222732;
    --ink:#f4f6fa; --ink-2:#aab2bf; --muted:#7d8590;
    --grid:#262b34; --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.16);
    --accent:#3987e5; --accent-ink:#7fb2f0; --accent-weak:#15233a;
    --good:#2bb32b; --warning:#fab219; --serious:#ec835a; --critical:#e05656;
    --good-weak:#12261a; --warning-weak:#2a230f; --serious-weak:#2b1d15; --critical-weak:#2c1616;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }}
  :root[data-theme="dark"]{
    --plane:#0b0d11; --surface:#14171d; --surface-2:#1a1e26; --surface-3:#222732;
    --ink:#f4f6fa; --ink-2:#aab2bf; --muted:#7d8590;
    --grid:#262b34; --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.16);
    --accent:#3987e5; --accent-ink:#7fb2f0; --accent-weak:#15233a;
    --good:#2bb32b; --warning:#fab219; --serious:#ec835a; --critical:#e05656;
    --good-weak:#12261a; --warning-weak:#2a230f; --serious-weak:#2b1d15; --critical-weak:#2c1616;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--plane); color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif; margin:0; text-wrap:balance; letter-spacing:-.01em}
  .wrap{max-width:1200px; margin:0 auto; padding:26px 22px 60px}
  .tnum{font-variant-numeric:tabular-nums}

  /* Header */
  header.top{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:22px}
  .brand{display:flex; gap:13px; align-items:center}
  .logo{width:42px; height:42px; border-radius:11px; background:linear-gradient(145deg,var(--accent),var(--accent-ink));
    display:grid; place-items:center; color:#fff; font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:19px; flex:none;
    box-shadow:0 2px 8px rgba(42,120,214,.35)}
  .brand h1{font-size:22px; font-weight:700}
  .brand .sub{color:var(--ink-2); font-size:13px; margin-top:1px}
  .meta{display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end}
  .chip{display:inline-flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--border);
    border-radius:999px; padding:7px 13px; font-size:12.5px; color:var(--ink-2); box-shadow:var(--shadow)}
  .chip b{color:var(--ink); font-weight:600}
  .chip .dot{width:7px; height:7px; border-radius:50%; background:var(--good)}
  .icon-btn{cursor:pointer; background:var(--surface); border:1px solid var(--border); color:var(--ink-2);
    border-radius:999px; width:38px; height:38px; display:grid; place-items:center; box-shadow:var(--shadow)}
  .icon-btn:hover{color:var(--ink); border-color:var(--border-strong)}
  .icon-btn svg{width:18px; height:18px}

  /* KPI tiles */
  .kpis{display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:16px}
  .kpi{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:15px 16px; box-shadow:var(--shadow)}
  .kpi .lbl{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; display:flex; align-items:center; gap:6px}
  .kpi .val{font-size:27px; font-weight:600; margin-top:8px; letter-spacing:-.02em}
  .kpi .sub{font-size:12px; color:var(--ink-2); margin-top:2px}
  .kpi .src{font-size:10.5px; color:var(--muted); margin-top:7px; text-transform:uppercase; letter-spacing:.04em}
  .kpi.accent{background:linear-gradient(160deg,var(--accent-weak),var(--surface))}

  /* Panels grid */
  .cols{display:grid; grid-template-columns:1.55fr 1fr; gap:16px; margin-bottom:16px}
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow)}
  .panel .phead{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:15px 18px 6px}
  .panel h2{font-size:15px; font-weight:600}
  .panel .pnote{font-size:12px; color:var(--muted)}
  .panel .pbody{padding:8px 18px 18px}

  /* Bar chart */
  .bars{display:flex; flex-direction:column; gap:9px; margin-top:8px}
  .bar-row{display:grid; grid-template-columns:1fr auto; gap:4px}
  .bar-lbl{font-size:12.5px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
  .bar-val{font-size:12.5px; font-weight:600; color:var(--ink)}
  .bar-track{grid-column:1 / -1; height:9px; background:var(--surface-2); border-radius:5px; overflow:hidden}
  .bar-fill{height:100%; border-radius:5px; background:linear-gradient(90deg,var(--accent),var(--accent-ink)); min-width:3px;
    transition:width .8s cubic-bezier(.2,.7,.2,1)}

  /* Opportunities */
  .opp{padding:8px 18px 18px}
  .opp-head{display:flex; align-items:baseline; gap:10px; margin:6px 0 12px}
  .opp-head .big{font-family:"Bricolage Grotesque",sans-serif; font-size:34px; font-weight:700; color:var(--accent-ink); letter-spacing:-.02em}
  .opp-head .txt{font-size:12.5px; color:var(--ink-2)}
  .opp-list{display:flex; flex-direction:column; gap:7px}
  .opp-item{display:flex; align-items:center; gap:10px; padding:9px 11px; background:var(--surface-2); border-radius:var(--r-sm)}
  .opp-item .kw{font-size:12.5px; font-weight:500; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .opp-item .pos{font-size:12px; font-weight:600; color:var(--warning)}

  /* Tabs + tables */
  .tabs{display:flex; gap:6px; align-items:center; margin:22px 0 12px; flex-wrap:wrap}
  .tab{cursor:pointer; border:1px solid var(--border); background:var(--surface); color:var(--ink-2);
    padding:9px 16px; border-radius:999px; font-size:13px; font-weight:500; font-family:inherit; display:flex; gap:8px; align-items:center}
  .tab .n{background:var(--surface-3); color:var(--ink-2); border-radius:999px; padding:1px 8px; font-size:11.5px; font-weight:600}
  .tab[aria-selected="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
  .tab[aria-selected="true"] .n{background:rgba(255,255,255,.24); color:#fff}
  .search{margin-left:auto; position:relative}
  .search input{font-family:inherit; font-size:13px; background:var(--surface); border:1px solid var(--border); color:var(--ink);
    border-radius:999px; padding:9px 15px 9px 34px; width:230px; max-width:52vw}
  .search input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent)}
  .search svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--muted)}

  .table-wrap{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow); overflow-x:auto}
  table{width:100%; border-collapse:collapse; font-size:13px; min-width:640px}
  thead th{position:sticky; top:0; background:var(--surface); text-align:right; font-weight:600; color:var(--ink-2);
    font-size:11px; text-transform:uppercase; letter-spacing:.05em; padding:13px 14px; border-bottom:1px solid var(--border-strong);
    cursor:pointer; white-space:nowrap; user-select:none}
  thead th:first-child{text-align:left}
  thead th .ar{opacity:0; margin-left:4px; font-size:10px}
  thead th[data-dir] .ar{opacity:1; color:var(--accent)}
  tbody td{text-align:right; padding:12px 14px; border-bottom:1px solid var(--grid); white-space:nowrap}
  tbody td:first-child{text-align:left; white-space:normal}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:var(--surface-2)}
  .cell-main{font-weight:500; color:var(--ink)}
  .cell-main a{color:var(--ink); text-decoration:none}
  .cell-main a:hover{color:var(--accent); text-decoration:underline}
  .cell-path{display:block; font-size:11.5px; color:var(--muted); margin-top:2px; max-width:360px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .pill{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; font-variant-numeric:tabular-nums}
  .pill::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor}
  .pill.p-good{color:var(--good); background:var(--good-weak)}
  .pill.p-warn{color:var(--warning); background:var(--warning-weak)}
  .pill.p-ser{color:var(--serious); background:var(--serious-weak)}
  .pill.p-crit{color:var(--critical); background:var(--critical-weak)}
  .empty{padding:34px; text-align:center; color:var(--muted); font-size:13px}

  footer{margin-top:26px; color:var(--muted); font-size:12px; line-height:1.7; border-top:1px solid var(--border); padding-top:16px}
  footer b{color:var(--ink-2); font-weight:600}

  /* Tooltip */
  #tip{position:fixed; z-index:50; pointer-events:none; background:var(--ink); color:var(--surface);
    padding:7px 10px; border-radius:8px; font-size:12px; box-shadow:0 6px 20px rgba(0,0,0,.25); opacity:0; transition:opacity .12s; max-width:260px}
  #tip .t-kw{font-weight:600; display:block; margin-bottom:2px}

  @media (max-width:860px){
    .kpis{grid-template-columns:repeat(3,1fr)}
    .cols{grid-template-columns:1fr}
  }
  @media (max-width:520px){ .kpis{grid-template-columns:repeat(2,1fr)} .brand h1{font-size:19px} }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

<script>
(() => {
  "use strict";
  const $ = (s,r=document) => r.querySelector(s);
  const fmt = n => new Intl.NumberFormat("fr-FR").format(Math.round(n));
  const pct = n => (n*100).toLocaleString("fr-FR",{maximumFractionDigits:1})+" %";
  const secs = n => n>=60 ? Math.floor(n/60)+" min "+String(Math.round(n%60)).padStart(2,"0")+"s" : Math.round(n)+"s";
  const pos = n => n.toLocaleString("fr-FR",{minimumFractionDigits:1,maximumFractionDigits:1});

  let DATA;
  try { DATA = JSON.parse($("#seo-data").textContent); }
  catch(e){ document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif">Données invalides.</p>'; return; }

  const arts = DATA.articles||[], kws = DATA.keywords||[], meta = DATA.meta||{};
  const pathTitle = {}; arts.forEach(a => pathTitle[a.path] = a.title);

  // --- meta ---
  $("#m-period").textContent = meta.period||"—";
  $("#m-updated").textContent = meta.updated||"—";
  $("#n-art").textContent = arts.length;
  $("#n-kw").textContent = kws.length;
  $("#bars-note").textContent = Math.min(10,arts.length)+" premiers";

  // --- KPIs ---
  const tot = (arr,k) => arr.reduce((s,x)=>s+(x[k]||0),0);
  const totClicks = tot(arts,"clicks"), totImpr = tot(arts,"impressions"), totViews = tot(arts,"views");
  const wPos = totImpr ? arts.reduce((s,a)=>s+a.position*a.impressions,0)/totImpr : 0;
  const kpis = [
    {lbl:"Articles suivis", val:fmt(arts.length), sub:"pages positionnées", src:"GSC"},
    {lbl:"Mots-clés", val:fmt(kws.length), sub:"requêtes positionnées", src:"GSC", accent:true},
    {lbl:"Clics", val:fmt(totClicks), sub:"cumulés sur la période", src:"GSC"},
    {lbl:"Impressions", val:fmt(totImpr), sub:"cumulées", src:"GSC"},
    {lbl:"Position moy.", val:pos(wPos), sub:"pondérée impressions", src:"GSC"},
    {lbl:"Vues", val:fmt(totViews), sub:"pages vues", src:"GA4"}
  ];
  $("#kpis").innerHTML = kpis.map(k=>`<div class="kpi${k.accent?' accent':''}">
    <div class="lbl">${k.lbl}</div><div class="val tnum">${k.val}</div>
    <div class="sub">${k.sub}</div><div class="src">${k.src}</div></div>`).join("");

  // --- Bar chart (top articles by clicks) ---
  const top = [...arts].sort((a,b)=>b.clicks-a.clicks).slice(0,10);
  const max = Math.max(...top.map(a=>a.clicks),1);
  $("#bars").innerHTML = top.map(a=>`<div class="bar-row" data-kw="${esc(a.title)}" data-val="${fmt(a.clicks)} clics · ${fmt(a.impressions)} impr.">
      <span class="bar-lbl">${esc(a.title)}</span><span class="bar-val tnum">${fmt(a.clicks)}</span>
      <span class="bar-track"><span class="bar-fill" style="width:0"></span></span></div>`).join("");
  requestAnimationFrame(()=>{ $("#bars").querySelectorAll(".bar-row").forEach((r,i)=>{
    r.querySelector(".bar-fill").style.width = (top[i].clicks/max*100)+"%"; }); });

  // --- Quick wins (position 5-15) ---
  const wins = kws.filter(k=>k.position>=5 && k.position<=15).sort((a,b)=>b.impressions-a.impressions);
  $("#opp-count").textContent = wins.length;
  $("#opp-list").innerHTML = (wins.slice(0,5).map(w=>`<div class="opp-item">
      <span class="kw">${esc(w.kw)}</span><span class="pos tnum">#${pos(w.position)}</span></div>`).join(""))
      || '<div class="empty" style="padding:12px">Aucun mot-clé en position 5–15.</div>';

  // --- Tables ---
  const posPill = p => { const c = p<=3?"p-good":p<=10?"p-warn":p<=20?"p-ser":"p-crit";
    return `<span class="pill ${c} tnum">${pos(p)}</span>`; };
  const cols = {
    articles: [
      {k:"title", lbl:"Article", num:false, cell:a=>`<span class="cell-main"><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a><span class="cell-path">${esc(a.path)}</span></span>`},
      {k:"clicks", lbl:"Clics", cell:a=>fmt(a.clicks)},
      {k:"impressions", lbl:"Impr.", cell:a=>fmt(a.impressions)},
      {k:"ctr", lbl:"CTR", cell:a=>pct(a.ctr)},
      {k:"position", lbl:"Position", cell:a=>posPill(a.position)},
      {k:"views", lbl:"Vues", cell:a=>fmt(a.views)},
      {k:"avg_time", lbl:"Tps moy.", cell:a=>secs(a.avg_time)},
      {k:"keyword_count", lbl:"Mots-clés", cell:a=>fmt(a.keyword_count)}
    ],
    keywords: [
      {k:"kw", lbl:"Mot-clé", num:false, cell:w=>`<span class="cell-main">${esc(w.kw)}</span>`},
      {k:"path", lbl:"Article", num:false, cell:w=>`<span class="cell-path" style="max-width:280px">${esc(pathTitle[w.path]||w.path)}</span>`},
      {k:"clicks", lbl:"Clics", cell:w=>fmt(w.clicks)},
      {k:"impressions", lbl:"Impr.", cell:w=>fmt(w.impressions)},
      {k:"ctr", lbl:"CTR", cell:w=>pct(w.ctr)},
      {k:"position", lbl:"Position", cell:w=>posPill(w.position)}
    ]
  };

  let state = {tab:"articles", sort:"clicks", dir:-1, q:""};

  function rowsFor(){
    let rows = state.tab==="articles" ? [...arts] : [...kws];
    if(state.tab==="keywords" && state.q){
      const q = state.q.toLowerCase();
      rows = rows.filter(w => w.kw.toLowerCase().includes(q) || (pathTitle[w.path]||w.path).toLowerCase().includes(q));
    }
    const s = state.sort;
    rows.sort((a,b)=>{ const va=a[s], vb=b[s];
      if(typeof va==="string") return state.dir*va.localeCompare(vb,"fr");
      return state.dir*((va||0)-(vb||0)); });
    return rows;
  }

  function render(){
    const cs = cols[state.tab];
    $("#thead").innerHTML = "<tr>"+cs.map(c=>{
      const active = c.k===state.sort;
      const dir = active ? (state.dir<0?"▼":"▲") : "";
      return `<th data-k="${c.k}"${active?` data-dir="${state.dir}"`:""}>${c.lbl}<span class="ar">${dir}</span></th>`;
    }).join("")+"</tr>";
    const rows = rowsFor();
    $("#tbody").innerHTML = rows.length ? rows.map(r=>"<tr>"+cs.map(c=>`<td>${c.cell(r)}</td>`).join("")+"</tr>").join("")
      : `<tr><td colspan="${cs.length}"><div class="empty">Aucun résultat.</div></td></tr>`;
    $("#thead").querySelectorAll("th").forEach(th=>th.onclick=()=>{
      const k = th.dataset.k;
      if(state.sort===k){ state.dir*=-1; } else { state.sort=k; state.dir = (k==="kw"||k==="title"||k==="path")?1:-1; }
      render();
    });
  }

  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected", x===t));
    state.tab = t.dataset.tab;
    state.sort = state.tab==="articles" ? "clicks" : "clicks"; state.dir=-1;
    $("#search-box").hidden = state.tab!=="keywords";
    render();
  });
  $("#search").addEventListener("input", e=>{ state.q=e.target.value; render(); });

  // --- Chart tooltip ---
  const tip = $("#tip");
  document.querySelectorAll(".bar-row").forEach(r=>{
    r.addEventListener("mousemove", e=>{
      tip.querySelector(".t-kw").textContent = r.dataset.kw;
      tip.querySelector(".t-val").textContent = r.dataset.val;
      tip.style.opacity=1; tip.style.left=Math.min(e.clientX+14, innerWidth-260)+"px"; tip.style.top=(e.clientY+14)+"px";
    });
    r.addEventListener("mouseleave", ()=>tip.style.opacity=0);
  });

  // --- Theme toggle ---
  $("#theme").onclick = ()=>{
    const cur = document.documentElement.getAttribute("data-theme");
    const dark = cur ? cur==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
    document.documentElement.setAttribute("data-theme", dark?"light":"dark");
  };

  // --- Footer ---
  const demo = meta.demo;
  $("#footer").innerHTML = `
    <b>${demo?"Aperçu — données d'exemple.":"Données réelles."}</b>
    ${demo?"Le rendu ci-dessus illustre le tableau de bord ; une fois les accès Google branchés, il affichera les vraies données de dillygence.com.":""}
    Les <b>mots-clés, positions, clics et impressions</b> proviennent de Google Search Console ;
    les <b>vues et le temps passé</b> de Google Analytics 4. Jointure par URL. Position moyenne pondérée par les impressions.
    ${meta.generated?`<br>Généré : ${esc(meta.generated)}.`:""}`;

  function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  render();
})();
</script>

name: Framer Probe

# Découvre la structure réelle de tes collections Framer (IDs, champs des items).
# À lancer manuellement une fois pour finaliser la config Framer.
# Regarde le résultat dans les logs du run (étape "Sonder l'API Framer").

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sonder l'API Framer
        working-directory: seo-tracker
        env:
          # Google requis par la config (valeurs bidon acceptées ici : on ne les utilise pas).
          GOOGLE_APPLICATION_CREDENTIALS: "unused"
          GSC_SITE_URL: "sc-domain:dillygence.com"
          GA4_PROPERTY_ID: "0"
          FRAMER_API_TOKEN: ${{ secrets.FRAMER_API_TOKEN }}
          FRAMER_COLLECTIONS: ${{ vars.FRAMER_COLLECTIONS }}
          FRAMER_BASE_URL: ${{ vars.FRAMER_BASE_URL }}
        run: python -m seo_tracker.framer

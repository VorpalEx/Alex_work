name: SEO Dashboard

# Génère le dashboard HTML + CSV (SANS Notion). Ne requiert que les accès Google.
# Le résultat est téléchargeable dans l'onglet Actions -> le run -> section "Artifacts".

on:
  schedule:
    - cron: "0 6 * * *"      # tous les jours à 06:00 UTC
  workflow_dispatch: {}       # lancement manuel

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        working-directory: seo-tracker
        run: pip install -r requirements.txt

      - name: Générer le dashboard
        working-directory: seo-tracker
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          ARTICLE_URL_REGEX: ${{ vars.ARTICLE_URL_REGEX }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS }}
          MIN_IMPRESSIONS: ${{ vars.MIN_IMPRESSIONS }}
          MAX_KEYWORDS_PER_ARTICLE: ${{ vars.MAX_KEYWORDS_PER_ARTICLE }}
        run: python -m seo_tracker.report out

      - name: Publier le dashboard (artefact téléchargeable)
        uses: actions/upload-artifact@v4
        with:
          name: seo-dashboard
          path: |
            seo-tracker/out/dashboard.html
            seo-tracker/out/articles.csv
            seo-tracker/out/keywords.csv
          retention-days: 30

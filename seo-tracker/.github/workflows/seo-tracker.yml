name: SEO Tracker

on:
  schedule:
    # Tous les jours à 06:00 UTC (08:00 heure de Paris en été, 07:00 en hiver).
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # permet un lancement manuel depuis l'onglet Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        working-directory: seo-tracker
        run: pip install -r requirements.txt

      - name: Lancer la synchronisation
        working-directory: seo-tracker
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ARTICLES: ${{ secrets.NOTION_DB_ARTICLES }}
          NOTION_DB_KEYWORDS: ${{ secrets.NOTION_DB_KEYWORDS }}
          FRAMER_API_TOKEN: ${{ secrets.FRAMER_API_TOKEN }}
          FRAMER_COLLECTIONS: ${{ vars.FRAMER_COLLECTIONS }}
          FRAMER_BASE_URL: ${{ vars.FRAMER_BASE_URL }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          FRAMER_SLUG_FIELD: ${{ vars.FRAMER_SLUG_FIELD }}
          FRAMER_TITLE_FIELD: ${{ vars.FRAMER_TITLE_FIELD }}
          ARTICLE_URL_REGEX: ${{ vars.ARTICLE_URL_REGEX }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS }}
          MIN_IMPRESSIONS: ${{ vars.MIN_IMPRESSIONS }}
          MAX_KEYWORDS_PER_ARTICLE: ${{ vars.MAX_KEYWORDS_PER_ARTICLE }}
          PRUNE_STALE: ${{ vars.PRUNE_STALE }}
        run: python -m seo_tracker.main

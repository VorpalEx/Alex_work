name: SEO Dashboard

# Génère le dashboard HTML + CSV (SANS Notion). Ne requiert que les accès Google.
# (Optionnel) inventaire complet des articles via Framer.
# - Artefact téléchargeable dans l'onglet Actions -> le run -> section "Artifacts".
# - Publié aussi sur GitHub Pages : URL fixe, mise à jour à chaque run (chaque matin).

on:
  schedule:
    - cron: "0 6 * * *"      # tous les jours à 06:00 UTC
  workflow_dispatch: {}       # lancement manuel

# Droits nécessaires au déploiement GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement Pages à la fois.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FRAMER_INVENTORY_FILE: ${{ github.workspace }}/seo-tracker/framer_inventory.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances Python
        working-directory: seo-tracker
        run: pip install -r requirements.txt

      # Inventaire Framer (ignoré proprement si non configuré).
      - name: Récupérer l'inventaire Framer
        if: ${{ vars.FRAMER_PROJECT_URL != '' }}
        working-directory: seo-tracker/framer
        env:
          FRAMER_PROJECT_URL: ${{ vars.FRAMER_PROJECT_URL }}
          FRAMER_API_KEY: ${{ secrets.FRAMER_API_TOKEN }}
          FRAMER_COLLECTIONS: ${{ vars.FRAMER_COLLECTIONS }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          FRAMER_SLUG_FIELD: ${{ vars.FRAMER_SLUG_FIELD }}
          FRAMER_TITLE_FIELD: ${{ vars.FRAMER_TITLE_FIELD }}
        run: npm install && node fetch_inventory.mjs

      - name: Générer le dashboard
        working-directory: seo-tracker
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          ARTICLE_URL_REGEX: ${{ vars.ARTICLE_URL_REGEX }}
          ARTICLE_URL_EXCLUDE: ${{ vars.ARTICLE_URL_EXCLUDE }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS }}
          MIN_IMPRESSIONS: ${{ vars.MIN_IMPRESSIONS }}
          MAX_KEYWORDS_PER_ARTICLE: ${{ vars.MAX_KEYWORDS_PER_ARTICLE }}
        run: python -m seo_tracker.report out

      - name: Publier le dashboard (artefact téléchargeable)
        uses: actions/upload-artifact@v4
        with:
          name: seo-dashboard
          path: |
            seo-tracker/out/dashboard.html
            seo-tracker/out/articles.csv
            seo-tracker/out/keywords.csv
            seo-tracker/out/data.json
          retention-days: 30

      # Prépare le site : le dashboard devient la page d'accueil (index.html).
      # Non-bloquant : si Pages n'est pas (encore) activé, la génération et
      # l'artefact téléchargeable restent en succès.
      - name: Préparer le site GitHub Pages
        run: |
          mkdir -p _site
          cp seo-tracker/out/dashboard.html _site/index.html
          cp seo-tracker/out/articles.csv seo-tracker/out/keywords.csv _site/ || true
          cp seo-tracker/out/data.json _site/ || true

      - name: Uploader l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: _site

  # Déploiement sur GitHub Pages (URL fixe, à jour à chaque run).
  # Prérequis : activer Pages une fois — Settings → Pages → Source : GitHub Actions.
  # Non-bloquant : tant que Pages n'est pas activé, ce job n'échoue pas le workflow.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

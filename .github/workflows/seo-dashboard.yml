name: SEO Dashboard

# Génère le dashboard HTML + CSV (SANS Notion). Ne requiert que les accès Google.
# (Optionnel) inventaire complet des articles via Framer.
# Le résultat est téléchargeable dans l'onglet Actions -> le run -> section "Artifacts".

on:
  schedule:
    - cron: "0 6 * * *"      # tous les jours à 06:00 UTC
  workflow_dispatch: {}       # lancement manuel

env:
  FRAMER_INVENTORY_FILE: ${{ github.workspace }}/seo-tracker/framer_inventory.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances Python
        working-directory: seo-tracker
        run: pip install -r requirements.txt

      # Inventaire Framer (ignoré proprement si non configuré).
      - name: Récupérer l'inventaire Framer
        if: ${{ vars.FRAMER_PROJECT_URL != '' }}
        working-directory: seo-tracker/framer
        env:
          FRAMER_PROJECT_URL: ${{ vars.FRAMER_PROJECT_URL }}
          FRAMER_API_KEY: ${{ secrets.FRAMER_API_TOKEN }}
          FRAMER_COLLECTIONS: ${{ vars.FRAMER_COLLECTIONS }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          FRAMER_SLUG_FIELD: ${{ vars.FRAMER_SLUG_FIELD }}
          FRAMER_TITLE_FIELD: ${{ vars.FRAMER_TITLE_FIELD }}
        run: npm install && node fetch_inventory.mjs

      - name: Générer le dashboard
        working-directory: seo-tracker
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          ARTICLE_URL_REGEX: ${{ vars.ARTICLE_URL_REGEX }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS }}
          MIN_IMPRESSIONS: ${{ vars.MIN_IMPRESSIONS }}
          MAX_KEYWORDS_PER_ARTICLE: ${{ vars.MAX_KEYWORDS_PER_ARTICLE }}
        run: python -m seo_tracker.report out

      - name: Publier le dashboard (artefact téléchargeable)
        uses: actions/upload-artifact@v4
        with:
          name: seo-dashboard
          path: |
            seo-tracker/out/dashboard.html
            seo-tracker/out/articles.csv
            seo-tracker/out/keywords.csv
          retention-days: 30

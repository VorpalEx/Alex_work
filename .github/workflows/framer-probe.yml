name: Framer Probe

# Découvre la structure réelle de tes collections Framer (noms, IDs, champs des items)
# via le SDK officiel `framer-api`. À lancer manuellement une fois.
# Regarde le résultat dans les logs du run (étape "Sonder Framer").

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer framer-api
        working-directory: seo-tracker/framer
        run: npm install

      - name: Sonder Framer
        working-directory: seo-tracker/framer
        env:
          FRAMER_PROJECT_URL: ${{ vars.FRAMER_PROJECT_URL }}
          FRAMER_API_KEY: ${{ secrets.FRAMER_API_TOKEN }}
        run: node probe.mjs
